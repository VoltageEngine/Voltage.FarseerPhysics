name: Release

# Builds the plugin package and attaches it to a tagged release.
#
# The plugin binds to a built engine rather than a NuGet package, so the engine is checked out and built
# first. Pinning the engine ref (below) keeps a release reproducible: a plugin built against a moving main
# branch could compile today and fail against the same tag tomorrow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      engine_ref:
        description: 'Engine ref to build against'
        default: 'main'

env:
  ENGINE_REPO: VoltageEngine/VoltageEngine
  ENGINE_REF: ${{ github.event.inputs.engine_ref || 'main' }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_REF }}
          path: VoltageEngine

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Both configurations are needed: Release for the game-side lib/, Editor-Release for editor-lib/.
      # EDITOR changes the engine's public surface, so each plugin configuration needs its counterpart.
      - name: Build the engine
        run: |
          dotnet build VoltageEngine/Voltage.Engine/Voltage.Engine.csproj -c Release
          dotnet build VoltageEngine/Voltage.Engine/Voltage.Engine.csproj -c Editor-Release

      - name: Stage the plugin package
        working-directory: plugin
        run: dotnet msbuild Voltage.FarseerPhysics.csproj -t:PackagePlugin

      - name: Verify the package layout
        working-directory: plugin
        run: |
          for f in plugin.json lib/Voltage.FarseerPhysics.dll editor-lib/Voltage.FarseerPhysics.dll; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done

      # The manifest version is what the editor displays and what dependency ranges resolve against, so a
      # tag that disagrees with it would ship a mislabelled package.
      - name: Check plugin.json version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: plugin
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(grep -o '"Version"[[:space:]]*:[[:space:]]*"[^"]*"' plugin.json | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match plugin.json Version $MANIFEST"
            exit 1
          fi

      - name: Zip the package
        working-directory: plugin
        run: zip -r "voltage.farseer-${GITHUB_REF_NAME#v}.zip" plugin.json lib editor-lib

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: plugin/voltage.farseer-*.zip

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voltage.farseer-package
          path: plugin/voltage.farseer-*.zip
